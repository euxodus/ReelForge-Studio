name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          unzip -q -o ReelForge-Studio.zip -d src
          if [ -d src/ReelForge-Studio ]; then mv src/ReelForge-Studio app; else mv src app; fi
          ls -la app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        working-directory: app
        run: |
          rm -rf android
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build the APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "dist/ReelForge-Studio-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ReelForge-Studio-APK
          path: dist/*.apk

      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: ReelForge Studio, build ${{ github.run_number }}
          files: dist/*.apk
