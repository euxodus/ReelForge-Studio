name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: |
          rm -rf android
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/ReelForge-Studio-build-${{ github.run_number }}.apk"

      - name: Upload APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: ReelForge-Studio-APK
          path: dist/*.apk

      - name: Publish APK (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ReelForge Studio, build ${{ github.run_number }}
          files: dist/*.apk
          body: |
            Download the .apk file below on your Android phone, open it, and allow installing from this source when asked.
